<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2154A6" />
    <title>Cermont - Sin conexión</title>
    <style>
      :root {
        color-scheme: light dark;
        --brand: #2154a6;
        --brand-soft: rgba(33, 84, 166, 0.12);
        --focus: #4caf50;
        --text: #0f172a;
        --text-soft: #475569;
        --bg: #f8fafc;
        --card: #ffffff;
        --border: rgba(15, 23, 42, 0.08);
        --shadow: 0 12px 32px rgba(15, 23, 42, 0.12);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --text: #e2e8f0;
          --text-soft: #cbd5e1;
          --bg: #0f172a;
          --card: #111827;
          --border: #1f2937;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        -webkit-font-smoothing: antialiased;
      }
      main {
        max-width: 480px;
        width: 100%;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 28px;
        box-shadow: var(--shadow);
        text-align: center;
      }
      .icon {
        width: 48px;
        height: 48px;
        margin: 0 auto 16px;
        border-radius: 9999px;
        background: var(--brand-soft);
        color: var(--brand);
        display: grid;
        place-items: center;
        font-size: 24px;
        font-weight: 700;
      }
      .eyebrow {
        margin: 0 0 8px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--brand);
      }
      h1 {
        margin: 0 0 12px;
        font-size: 1.375rem;
        line-height: 1.3;
      }
      p {
        margin: 0 0 16px;
        line-height: 1.55;
        color: var(--text-soft);
        font-size: 0.95rem;
      }
      .status {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 10px 14px;
        margin: 0 0 20px;
        border: 1px solid rgba(76, 175, 80, 0.3);
        background: rgba(76, 175, 80, 0.06);
        border-radius: 10px;
        font-size: 0.8rem;
        color: var(--text-soft);
      }
      .status .dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 9999px;
        background: var(--focus);
        animation: pulse 1.4s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }
      button {
        border: 0;
        border-radius: 9999px;
        padding: 12px 24px;
        background: var(--brand);
        color: #fff;
        font-weight: 600;
        font-size: 0.95rem;
        cursor: pointer;
        min-width: 160px;
        min-height: 44px;
        transition: opacity 0.15s ease;
      }
      button:hover { opacity: 0.9; }
      button:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="icon" aria-hidden="true">·</div>
      <p class="eyebrow">Cermont Campo</p>
      <h1>Sin conexión a internet</h1>
      <p>
        No se pudo cargar esta página. Puedes consultar información cargada
        previamente y continuar con borradores locales. Los cambios pendientes
        se sincronizarán automáticamente cuando vuelvas a estar en línea.
      </p>
      <div class="status" role="status" aria-live="polite" id="reconnect-status">
        <span class="dot" aria-hidden="true"></span>
        <span id="reconnect-text">Verificando conexión…</span>
      </div>
      <button type="button" onclick="window.location.reload()">Reintentar ahora</button>
    </main>
    <script>
      (() => {
        var text = document.getElementById("reconnect-text");
        var backoff = 5000;
        var maxBackoff = 30000;
        var stopped = false;
        var controller = null;
        var timeout = null;

        async function check() {
          if (stopped) {
            return;
          }
          try {
            controller = new AbortController();
            timeout = setTimeout(() => {
              controller.abort();
            }, 4000);
            const response = await fetch("/api/health", {
              method: "HEAD",
              cache: "no-store",
              credentials: "omit",
              signal: controller.signal
            });
            clearTimeout(timeout);
            if (response.ok) {
              window.location.reload();
              return;
            }
            text.textContent = "Sin conexión — reintentando…";
          } catch {
            text.textContent = "Sin conexión — reintentando…";
          }
          backoff = Math.min(backoff * 1.5, maxBackoff);
          setTimeout(check, backoff);
        }

        window.addEventListener("online", () => {
          backoff = 5000;
          check();
        });
        window.addEventListener("offline", () => {
          text.textContent = "Sin conexión — reintentando…";
        });

        setTimeout(check, backoff);
        window.addEventListener("pagehide", () => {
          stopped = true;
        });
      })();
    </script>
  </body>
</html>
