<svg viewBox="0 0 192 192" fill="none" xmlns="http://www.w3.org/2000/svg" class="shortcut-icon" role="img" aria-labelledby="evidence-shortcut-title">
  <title id="evidence-shortcut-title">Acceso directo a evidencias</title>
  <style>
    .shortcut-icon { overflow: visible; cursor: pointer; }
    .item-layer { transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.3s ease; transform-origin: center; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1)); }
    .shortcut-icon:hover .item-layer { transform: scale(1.05) translateY(-2px); filter: drop-shadow(0 8px 12px rgba(0,0,0,0.15)); }
  </style>
  <defs>
    <linearGradient id="shortcutBg" x1="0" y1="0" x2="192" y2="192" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14366C"/>
      <stop offset="100%" stop-color="#0A1C3C"/>
    </linearGradient>
    <linearGradient id="folderGradient" x1="62" y1="26" x2="144" y2="66" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F1F8FF"/>
      <stop offset="100%" stop-color="#DCEBFF"/>
    </linearGradient>
    <linearGradient id="greenShape" x1="48" y1="82" x2="144" y2="126" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7CD966"/>
      <stop offset="100%" stop-color="#4CAF50"/>
    </linearGradient>
    <linearGradient id="blueCircle" x1="65" y1="62" x2="89" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5599FF"/>
      <stop offset="100%" stop-color="#3A78D8"/>
    </linearGradient>

    <!-- Small Bevel -->
    <filter id="smallBevel" x="-20%" y="-20%" width="140%" height="140%">
      <feComponentTransfer in="SourceAlpha" result="alpha"/>
      <feOffset dx="-0.5" dy="-1" in="alpha" result="offsetAlpha"/>
      <feGaussianBlur stdDeviation="1" in="offsetAlpha" result="blurAlpha"/>
      <feComposite operator="out" in="alpha" in2="blurAlpha" result="highlightMask"/>
      <feFlood flood-color="#ffffff" flood-opacity="0.5" result="highlightColor"/>
      <feComposite operator="in" in="highlightColor" in2="highlightMask" result="highlight"/>
      
      <feOffset dx="1" dy="1.5" in="alpha" result="offsetAlphaDark"/>
      <feGaussianBlur stdDeviation="1.5" in="offsetAlphaDark" result="blurAlphaDark"/>
      <feComposite operator="out" in="alpha" in2="blurAlphaDark" result="shadowMask"/>
      <feFlood flood-color="#000000" flood-opacity="0.25" result="shadowColor"/>
      <feComposite operator="in" in="shadowColor" in2="shadowMask" result="innerShadow"/>

      <feMerge>
        <feMergeNode in="SourceGraphic" />
        <feMergeNode in="highlight" />
        <feMergeNode in="innerShadow" />
      </feMerge>
    </filter>
  </defs>

  <rect width="192" height="192" rx="44" fill="url(#shortcutBg)"/>
  <rect x="28" y="38" width="136" height="116" rx="22" fill="#F8FAFC"/>
  
  <g class="item-layer">
    <path filter="url(#smallBevel)" d="M48 126L75 96L95 114L118 82L144 126H48Z" fill="url(#greenShape)"/>
    <circle filter="url(#smallBevel)" cx="77" cy="74" r="12" fill="url(#blueCircle)"/>
    <path filter="url(#smallBevel)" d="M62 26H100L114 40H130C137.732 40 144 46.268 144 54V66H48V54C48 46.268 54.268 40 62 40V26Z" fill="url(#folderGradient)"/>
  </g>
</svg>