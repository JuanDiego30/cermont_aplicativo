name: Deploy to Staging

on:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  deploy-staging:
    name: Deploy staging via SSH
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy current develop revision
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST_STAGING }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/cermont-staging/app
            git rev-parse HEAD > .last-known-good
            git fetch origin develop
            git checkout develop
            git pull --ff-only origin develop
            npm ci --include-workspace-root --workspaces
            npm run build
            npm run deploy:pm2:reload
            sleep 5
            curl --fail --silent --show-error --retry 12 --retry-delay 5 \
              http://127.0.0.1:4000/api/health/ready

      - name: Verify staging health
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST_STAGING }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            curl --fail --silent --show-error --retry 12 --retry-delay 5 \
              http://127.0.0.1/api/health/ready >/dev/null
