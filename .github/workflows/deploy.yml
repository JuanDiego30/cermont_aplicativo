name: Deploy to VPS

on:
  push:
    branches: [deploy/vps-clean]
  workflow_dispatch:
    inputs:
      environment:
        description: Deploy environment
        required: true
        default: production
        type: choice
        options:
          - production
          - staging

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Quality gates
        run: |
          npm run typecheck
          npm run lint
          npm run build
          npm run test
          npm run verify

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          script: |
            set -euo pipefail
            cd /opt/cermont/app
            git rev-parse HEAD > .last-known-good
            git fetch origin deploy/vps-clean
            git checkout deploy/vps-clean
            git pull --ff-only origin deploy/vps-clean
            npm ci --include-workspace-root --workspaces
            npm run build
            npm run deploy:pm2:reload
            sleep 5
            curl --fail --silent --show-error --retry 12 --retry-delay 5 \
              http://127.0.0.1:4000/api/health/ready

      - name: Verify deployment health (HTTPS)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          script: |
            set -euo pipefail
            curl --fail --silent --show-error --retry 12 --retry-delay 5 \
              https://${{ secrets.VPS_DOMAIN }}/api/health/ready >/dev/null
