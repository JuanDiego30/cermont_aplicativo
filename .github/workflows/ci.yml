name: CI — Quality Gates

on:
  push:
    branches: [main, develop, "audit/**", "feat/**", "fix/**", "refactor/**", "chore/**"]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        node-version: [22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type checking
        run: npm run typecheck

      - name: Lint (Biome)
        run: npm run lint

      - name: Build (shared-types → backend → frontend)
        run: npm run build

      - name: Test
        run: npm run test

      - name: Verify (typecheck + build — full integrity check)
        run: npm run verify
