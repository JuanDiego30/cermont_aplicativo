version: '3.9'

# ============================================================================
# Docker Compose para DESARROLLO
# Instalación: docker compose -f docker-compose.dev.yml up
# Logs: docker compose -f docker-compose.dev.yml logs -f
# Down: docker compose -f docker-compose.dev.yml down -v
# ============================================================================

services:
  # ============================================================================
  # MongoDB - Base de datos (desarrollo local)
  # ============================================================================
  mongodb:
    image: mongo:7.0-alpine
    container_name: cermont-mongodb-dev
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-cermont_dev}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-cermont_password_dev}
      MONGO_INITDB_DATABASE: cermont_dev
    volumes:
      - mongodb_dev_data:/data/db
      - ./docker/mongo-init.js:/docker-entrypoint-initdb.d/01-init.js:ro
    ports:
      - "127.0.0.1:27017:27017"
    networks:
      - cermont-network-dev
    command: mongod --wiredTigerCacheSizeGB 0.25
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M

  # ============================================================================
  # Redis - Cache & Sessions (opcional pero recomendado)
  # ============================================================================
  # redis:
  #   image: redis:7.4-alpine
  #   container_name: cermont-redis-dev
  #   restart: unless-stopped
  #   volumes:
  #     - redis_dev_data:/data
  #   ports:
  #     - "127.0.0.1:6379:6379"
  #   networks:
  #     - cermont-network-dev
  #   command: redis-server --appendonly yes --appendfsync everysec
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 10s
  #     timeout: 3s
  #     retries: 3
  #   deploy:
  #     resources:
  #       limits:
  #         memory: 256M

volumes:
  mongodb_dev_data:
    driver: local
  # redis_dev_data:
  #   driver: local

networks:
  cermont-network-dev:
    driver: bridge
