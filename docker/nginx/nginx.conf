events {
    worker_connections 1024;
}

http {
    upstream frontend {
        server frontend:3000;
    }

    upstream backend {
        server backend:4000;
    }

    server {
        listen 80;
        server_name _;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml;
        gzip_min_length 256;

        client_max_body_size 50M;

        # ─── Frontend SPA ───────────────────────────────────────────────
        # ALL traffic goes to the Next.js frontend first, including API
        # calls made via /api/backend/* (the frontend proxy handler
        # correctly rewrites /api/backend/auth/login → /api/auth/login).
        # This avoids CORS issues in development and ensures the proxy
        # handler (route.ts) can add auth headers, cookies, etc.
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 120s;
        }

        # ─── Legacy direct API proxy (bypass frontend) ──────────────────
        # Only matches /api/auth, /api/orders, etc. — NOT /api/backend/*
        # because nginx picks the longest matching prefix.
        # Used for health checks and server-to-server calls.
        location /api/health {
            proxy_pass http://backend/api/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
    }
}
